name: Alpha Loop Cycle

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: alpha-loop-cycle
  cancel-in-progress: false

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run one alpha_loop cycle
        env:
          MOONDEV_API_KEY: ${{ secrets.MOONDEV_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m alpha_loop.loop --once

      - name: Commit updated state
        run: |
          git config user.name "alpha-loop-bot"
          git config user.email "actions@users.noreply.github.com"
          git add alpha_loop/alpha_loop.db docs/research/alpha_loop/decision_log.md
          git diff --staged --quiet || git commit -m "alpha loop cycle $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
