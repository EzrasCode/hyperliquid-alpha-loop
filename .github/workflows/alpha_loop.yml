name: Alpha Loop Cycle

# Re-registered 2026-09-28 04:10 UTC -- the schedule trigger below hadn't
# self-fired after ~50 minutes despite Actions permissions, default branch,
# and workflow "active" state all checking out. Touching this file is a
# known nudge for GitHub's scheduler to re-evaluate the cron trigger.
on:
  schedule:
    # Offset off the round 5-minute mark on purpose: GitHub's own docs warn
    # that "*/5 * * * *" is the single most congested schedule slot, since
    # nearly every repo on the platform picks that exact pattern, and
    # queues runs behind all of them (sometimes for a very long time). This
    # still runs every 5 minutes, just not exactly on :00/:05/:10/etc.
    - cron: "3-59/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: alpha-loop-cycle
  cancel-in-progress: false

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run one alpha_loop cycle
        env:
          MOONDEV_API_KEY: ${{ secrets.MOONDEV_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m alpha_loop.loop --once

      - name: Commit updated state
        run: |
          git config user.name "alpha-loop-bot"
          git config user.email "actions@users.noreply.github.com"
          git add alpha_loop/alpha_loop.db docs/research/alpha_loop/

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "alpha loop cycle $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # alpha_loop.db is a binary SQLite file, so if another run's commit
          # landed on origin/main in between (e.g. two runs racing during a
          # scheduling backlog), git can't merge the two versions of it. On a
          # rejected push, fetch the latest and drop THIS run's commit rather
          # than fail the job -- losing one cycle's worth of research data to
          # a rare race is a cheap tradeoff for a loop that's designed to run
          # forever and accumulate over weeks.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt/3) -- another run already advanced main. Fetching latest."
            git fetch origin main
            git reset --hard origin/main
            sleep 2
          done
          echo "Could not push after 3 attempts; this cycle's update was dropped. Next scheduled cycle is unaffected."
